        /* Base styles */
        body {
            background-color: theme('colors.background');

        /* Glassmorphism Utilities */
        .glass-panel {
            background: rgba(255, 255, 255, 0.7); 
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(0,0,0,0.1);

        /* Ambient Glow */
        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px;

            filter: blur(60px);

        /* Gradient Text */
        .text-gradient {
            background: linear-gradient(135deg, theme('colors.primary') 0%, theme('colors.secondary') 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;

        /* Gradient Button */

<script>
(function () {
  "use strict";

  /* ---------------------------------------------------------------------
   * CONFIG
   * ------------------------------------------------------------------- */
  const CONFIG = {
    API_BASE_URL: "http://127.0.0.1:8080",
    ENDPOINTS: {
      HEALTH: "/api/health",
      WORKFLOW: "/api/run",
      LOGS: "/api/logs",
    },
  };

  /* ---------------------------------------------------------------------
   * API LAYER
   * ------------------------------------------------------------------- */
  const Api = {
    async _request(path, options = {}) {
      const url = CONFIG.API_BASE_URL + path;
      let response;
      try {
        response = await fetch(url, {
          headers: { "Content-Type": "application/json" },
          ...options,
        });
      } catch (err) {
        throw new ApiError(
          `Could not reach the backend at ${CONFIG.API_BASE_URL}. Is it running?`,
          0,
          null
        );
      }

      let body = null;
      const text = await response.text();
      if (text) {
        try {
          body = JSON.parse(text);
        } catch (_) {
          body = text;
        }
      }

      if (!response.ok) {
        if (response.status === 422) {
          const details = Array.isArray(body?.detail)
            ? body.detail.map((d) => d.msg || JSON.stringify(d)).join("; ")
            : body?.detail || "Validation error";
          throw new ApiError(details, 422, body);
        }
        throw new ApiError(
          body?.detail || `Request failed (${response.status})`,
          response.status,
          body
        );
      }
      return body;
    },

    checkHealth() {
      return Api._request(CONFIG.ENDPOINTS.HEALTH, { method: "GET" });
    },

    executeWorkflow(topic) {
      return Api._request(CONFIG.ENDPOINTS.WORKFLOW, {
        method: "POST",
        body: JSON.stringify({ topic }),
      });
    },

    getLogs(value = "") {
      return Api._request(CONFIG.ENDPOINTS.LOGS, {
        method: "POST",
        body: JSON.stringify({ value }),
      });
    },
  };

  class ApiError extends Error {
    constructor(message, status, body) {
      super(message);
      this.status = status;
      this.body = body;
    }
  }

  /* ---------------------------------------------------------------------
   * TOASTS
   * ------------------------------------------------------------------- */
  function toast(message, type = "info") {
    const stack = document.getElementById("toast-stack");
    const el = document.createElement("div");
    el.className = "toast" + (type === "error" ? " error" : "");
    el.textContent = message;
    stack.appendChild(el);
    setTimeout(() => {
      el.style.opacity = "0";
      el.style.transition = "opacity 0.3s ease";
      setTimeout(() => el.remove(), 300);
    }, 4000);
  }

  /* ---------------------------------------------------------------------
   * HEALTH STATUS
   * ------------------------------------------------------------------- */
  async function refreshHealthStatus() {
    const dot = document.getElementById("status-dot");
    const label = document.getElementById("status-label");
    dot.className = "status-dot checking";
    label.textContent = "Checking…";
    try {
      await Api.checkHealth();
      dot.className = "status-dot ok";
      label.textContent = "Connected";
    } catch (err) {
      dot.className = "status-dot bad";
      label.textContent = "Offline";
    }
  }

  /* ---------------------------------------------------------------------
   * RESULT RENDERING
   * A minimal, dependency-free markdown-ish renderer. The exact shape of
   * `data` from POST /api/workflow isn't fixed on the backend yet, so this
   * renderer is defensive: it looks for common field names first, then
   * falls back to pretty-printing whatever JSON comes back.
   * ------------------------------------------------------------------- */
  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function renderMarkdownish(raw) {
    const escaped = escapeHtml(raw);
    const lines = escaped.split("\n");
    let html = "";
    let inList = false;
    let inCode = false;

    for (const line of lines) {
      if (line.trim().startsWith("```")) {
        html += inCode ? "</code></pre>" : "<pre><code>";
        inCode = !inCode;
        continue;
      }
      if (inCode) {
        html += line + "\n";
        continue;
      }
      const heading = line.match(/^(#{1,3})\s+(.*)/);
      const listItem = line.match(/^[-*]\s+(.*)/);

      if (heading) {
        if (inList) { html += "</ul>"; inList = false; }
        const level = heading[1].length;
        html += `<h${level}>${heading[2]}</h${level}>`;
      } else if (listItem) {
        if (!inList) { html += "<ul>"; inList = true; }
        html += `<li>${inlineFormat(listItem[1])}</li>`;
      } else {
        if (inList) { html += "</ul>"; inList = false; }
        if (line.trim() === "") continue;
        html += `<p>${inlineFormat(line)}</p>`;
      }
    }
    if (inList) html += "</ul>";
    if (inCode) html += "</code></pre>";
    return html;
  }

  function inlineFormat(text) {
    return text
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/\*(.+?)\*/g, "<em>$1</em>")
      .replace(/`(.+?)`/g, "<code>$1</code>");
  }

  function extractBlogText(data) {
    if (typeof data === "string") return data;
    if (!data || typeof data !== "object") return null;
    const candidates = ["content", "blog", "post", "markdown", "text", "article", "body", "output"];
    for (const key of candidates) {
      if (typeof data[key] === "string" && data[key].trim()) return data[key];
    }
    return null;
  }

  function extractTitle(data) {
    if (!data || typeof data !== "object") return null;
    const candidates = ["title", "topic", "headline"];
    for (const key of candidates) {
      if (typeof data[key] === "string" && data[key].trim()) return data[key];
    }
    return null;
  }

  function renderResult(topic, payload) {
    const data = payload && typeof payload === "object" ? payload.data ?? payload : payload;
    const body = document.getElementById("result-body");
    const topicLabel = document.getElementById("result-topic-label");
    topicLabel.textContent = extractTitle(data) || topic;

    const blogText = extractBlogText(data);
    if (blogText) {
      body.innerHTML = renderMarkdownish(blogText);
    } else {
      // Fallback: pretty-print whatever structure came back so nothing is lost.
      const pre = document.createElement("pre");
      const code = document.createElement("code");
      code.textContent = JSON.stringify(data, null, 2);
      pre.appendChild(code);
      body.innerHTML = "";
      body.appendChild(pre);
    }
  }

  /* ---------------------------------------------------------------------
   * VIEW STATE
   * ------------------------------------------------------------------- */
  function showHero() {
    document.getElementById("hero-container").classList.remove("hidden");
    document.getElementById("hero-container").classList.add("flex");
    document.getElementById("result-container").classList.add("hidden");
    document.getElementById("result-container").classList.remove("flex");
    document.getElementById("loading-container").classList.add("hidden");
    document.getElementById("loading-container").classList.remove("flex");
  }

  function showLoading() {
    document.getElementById("hero-container").classList.add("hidden");
    document.getElementById("hero-container").classList.remove("flex");
    document.getElementById("result-container").classList.add("hidden");
    document.getElementById("result-container").classList.remove("flex");
    document.getElementById("loading-container").classList.remove("hidden");
    document.getElementById("loading-container").classList.add("flex");
  }

  function showResult() {
    document.getElementById("hero-container").classList.add("hidden");
    document.getElementById("hero-container").classList.remove("flex");
    document.getElementById("loading-container").classList.add("hidden");
    document.getElementById("loading-container").classList.remove("flex");
    document.getElementById("result-container").classList.remove("hidden");
    document.getElementById("result-container").classList.add("flex");
  }

  /* ---------------------------------------------------------------------
   * GENERATE FLOW
   * ------------------------------------------------------------------- */
  let lastTopic = "";
  let isGenerating = false;

  function setGenerateBusy(busy) {
    const btn = document.getElementById("generate-btn");
    const label = document.getElementById("generate-btn-label");
    const icon = document.getElementById("generate-btn-icon");
    btn.disabled = busy;
    label.textContent = busy ? "Generating…" : "Generate";
    icon.textContent = busy ? "progress_activity" : "magic_button";
    icon.classList.toggle("spin", busy);
  }

  function showInputError(msg) {
    const el = document.getElementById("input-error");
    if (!msg) {
      el.classList.add("hidden");
      el.textContent = "";
      return;
    }
    el.textContent = msg;
    el.classList.remove("hidden");
  }

  async function runGenerate(topic) {
    const trimmed = (topic || "").trim();
    if (!trimmed) {
      showInputError("Enter a topic before generating.");
      return;
    }
    if (isGenerating) return;

    showInputError(null);
    isGenerating = true;
    lastTopic = trimmed;
    setGenerateBusy(true);
    showLoading();

    try {
      const payload = await Api.executeWorkflow(trimmed);
      renderResult(trimmed, payload);
      showResult();
    } catch (err) {
      showHero();
      showInputError(err.message);
      toast(err.message, "error");
    } finally {
      isGenerating = false;
      setGenerateBusy(false);
    }
  }

  /* ---------------------------------------------------------------------
   * LOGS DRAWER
   * ------------------------------------------------------------------- */
  function openLogsDrawer() {
    document.getElementById("logs-drawer").classList.add("open");
    document.getElementById("logs-scrim").classList.add("open");
    loadLogsList("");
  }

  function closeLogsDrawer() {
    document.getElementById("logs-drawer").classList.remove("open");
    document.getElementById("logs-scrim").classList.remove("open");
  }

  async function loadLogsList(monthValue) {
    const content = document.getElementById("logs-content");
    const breadcrumb = document.getElementById("logs-breadcrumb");
    breadcrumb.textContent = monthValue || "This month";
    content.innerHTML = `<p class="font-body-md text-body-md text-on-surface-variant">Loading…</p>`;
    try {
      const result = await Api.getLogs(monthValue);
      const files = result?.files || [];
      if (!files.length) {
        content.innerHTML = `<p class="font-body-md text-body-md text-on-surface-variant">No log files found.</p>`;
        return;
      }
      content.innerHTML = "";
      const list = document.createElement("div");
      list.className = "flex flex-col gap-1";
      files.forEach((fileName) => {
        const btn = document.createElement("button");
        btn.className =
          "flex items-center gap-3 p-3 rounded-lg text-on-surface-variant hover:bg-on-surface/5 transition-colors font-body-md text-body-md text-left";
        btn.innerHTML = `<span class="material-symbols-outlined text-[20px]">description</span><span>${escapeHtml(fileName)}</span>`;
        btn.addEventListener("click", () => loadLogFile(fileName));
        list.appendChild(btn);
      });
      content.appendChild(list);
    } catch (err) {
      content.innerHTML = `<p class="font-body-md text-body-md text-error">${escapeHtml(err.message)}</p>`;
    }
  }

  async function loadLogFile(fileName) {
    const dateValue = fileName.replace(/\.log$/, "");
    const content = document.getElementById("logs-content");
    const breadcrumb = document.getElementById("logs-breadcrumb");
    content.innerHTML = `<p class="font-body-md text-body-md text-on-surface-variant">Loading…</p>`;
    try {
      const result = await Api.getLogs(dateValue);
      breadcrumb.textContent = result?.file_name || fileName;
      const lines = result?.content || [];
      const pre = document.createElement("pre");
      pre.className = "font-label-sm text-[12px] bg-on-background text-inverse-on-surface p-4 rounded-lg overflow-x-auto whitespace-pre-wrap";
      pre.textContent = lines.join("\n");

      const backBtn = document.createElement("button");
      backBtn.className = "flex items-center gap-2 text-on-surface-variant hover:text-primary transition-colors font-label-sm text-label-sm mb-4";
      backBtn.innerHTML = `<span class="material-symbols-outlined text-[18px]">arrow_back</span> Back to files`;
      backBtn.addEventListener("click", () => loadLogsList(""));

      content.innerHTML = "";
      content.appendChild(backBtn);
      content.appendChild(pre);
    } catch (err) {
      content.innerHTML = `<p class="font-body-md text-body-md text-error">${escapeHtml(err.message)}</p>`;
    }
  }

  /* ---------------------------------------------------------------------
   * INIT / EVENT WIRING
   * ------------------------------------------------------------------- */
  document.addEventListener("DOMContentLoaded", () => {
    refreshHealthStatus();

    const topicInput = document.getElementById("topic-input");
    const generateBtn = document.getElementById("generate-btn");

    generateBtn.addEventListener("click", () => runGenerate(topicInput.value));

    topicInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        runGenerate(topicInput.value);
      }
    });

    document.getElementById("result-back-btn").addEventListener("click", () => {
      showHero();
    });
    document.getElementById("result-regenerate-btn").addEventListener("click", () => {
      if (lastTopic) runGenerate(lastTopic);
    });

    document.getElementById("logs-open-btn").addEventListener("click", openLogsDrawer);
    document.getElementById("logs-close-btn").addEventListener("click", closeLogsDrawer);
    document.getElementById("logs-scrim").addEventListener("click", closeLogsDrawer);
  });
})();
</script>
</body></html>
